---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - schemapilot.schemapilot.com
  resources:
  - schemapilots
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - schemapilot.schemapilot.com
  resources:
  - schemapilots/finalizers
  verbs:
  - update
- apiGroups:
  - schemapilot.schemapilot.com
  resources:
  - schemapilots/status
  verbs:
  - get
  - patch
  - update
